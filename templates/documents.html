<!DOCTYPE html>
<html>
<head>
    <title>Uploaded Documents</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f5f7fa;
            padding: 40px 20px;
            color: #2c3e50;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }

        h1 {
            text-align: center;
            color: #2c3e50;
            margin-bottom: 30px;
            font-size: 2.2em;
            position: relative;
            padding-bottom: 10px;
        }

        h1::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 100px;
            height: 3px;
            background: #3498db;
        }

        .table-container {
            overflow-x: auto;
            margin: 20px 0;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background-color: white;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        th, td {
            padding: 15px;
            text-align: left;
            border-bottom: 1px solid #e0e0e0;
        }

        th {
            background-color: #3498db;
            color: white;
            font-weight: 500;
            text-transform: uppercase;
            font-size: 0.9em;
            letter-spacing: 1px;
        }

        tr:nth-child(even) {
            background-color: #f8f9fa;
        }

        tr:hover {
            background-color: #f1f4f7;
            transition: background-color 0.3s ease;
        }

        td {
            font-size: 0.95em;
        }

        .document-link {
            color: #3498db;
            text-decoration: none;
            padding: 6px 12px;
            border-radius: 4px;
            transition: all 0.3s ease;
            display: inline-block;
        }

        .document-link:hover {
            background-color: #3498db;
            color: white;
        }

        .back-link {
            display: inline-block;
            margin-top: 20px;
            padding: 10px 20px;
            background-color: #2c3e50;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            transition: background-color 0.3s ease;
        }

        .back-link:hover {
            background-color: #34495e;
        }

        .hash-cell {
            font-family: monospace;
            font-size: 0.85em;
            color: #666;
            max-width: 150px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        /* Responsive design */
        @media screen and (max-width: 768px) {
            .container {
                padding: 15px;
            }

            table {
                font-size: 14px;
            }

            th, td {
                padding: 10px;
            }

            .hash-cell {
                max-width: 100px;
            }
        }

        @media screen and (max-width: 480px) {
            h1 {
                font-size: 1.8em;
            }

            .hash-cell {
                max-width: 80px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Uploaded Documents</h1>
        <div class="table-container">
            <table>
                <tr>
                    <th>ID</th>
                    <th>Uploaded By</th>
                    <th>Document Hash</th>
                    <th>Timestamp</th>
                    <th>Previous Hash</th>
                    <th>Document</th>
                </tr>
                {% for doc in documents %}
                <tr>
                    <td>{{ doc.id }}</td>
                    <td>{{ doc.username }}</td>
                    <td class="hash-cell">{{ doc.document_hash }}</td>
                    <td>{{ doc.timestamp }}</td>
                    <td class="hash-cell">{{ doc.previous_hash }}</td>
                    <td><a href="/download/{{ doc.id }}" class="document-link">View Document</a></td>
                </tr>
                {% endfor %}
            </table>
        </div>
        <a href="/dashboard" class="back-link">Back to Dashboard</a>
    </div>
</body>
</html>
