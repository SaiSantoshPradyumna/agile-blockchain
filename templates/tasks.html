<!DOCTYPE html>
<html>
<head>
    <title>Tasks</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f5f7fa;
            padding: 40px 20px;
            color: #2c3e50;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }

        h1 {
            text-align: center;
            color: #2c3e50;
            margin-bottom: 30px;
            font-size: 2.2em;
            position: relative;
            padding-bottom: 10px;
        }

        h1::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 100px;
            height: 3px;
            background: #3498db;
        }

        .table-container {
            overflow-x: auto;
            margin: 20px 0;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background-color: white;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        th, td {
            padding: 15px;
            text-align: left;
            border-bottom: 1px solid #e0e0e0;
        }

        th {
            background-color: #3498db;
            color: white;
            font-weight: 500;
            text-transform: uppercase;
            font-size: 0.9em;
            letter-spacing: 1px;
            white-space: nowrap;
        }

        tr:nth-child(even) {
            background-color: #f8f9fa;
        }

        tr:hover {
            background-color: #f1f4f7;
            transition: background-color 0.3s ease;
        }

        td {
            font-size: 0.95em;
        }

        .status-cell {
            font-weight: 500;
        }

        .status-pending {
            color: #e67e22;
        }

        .status-completed {
            color: #27ae60;
        }

        .status-in-progress {
            color: #3498db;
        }

        .action-link {
            display: inline-block;
            padding: 6px 12px;
            background-color: #3498db;
            color: white;
            text-decoration: none;
            border-radius: 4px;
            transition: background-color 0.3s ease;
            font-size: 0.9em;
        }

        .action-link:hover {
            background-color: #2980b9;
        }

        .back-link {
            display: inline-block;
            margin-top: 20px;
            padding: 10px 20px;
            background-color: #2c3e50;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            transition: background-color 0.3s ease;
        }

        .back-link:hover {
            background-color: #34495e;
        }

        .description-cell {
            max-width: 200px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .timestamp-cell {
            white-space: nowrap;
            color: #666;
        }

        /* Responsive design */
        @media screen and (max-width: 768px) {
            .container {
                padding: 15px;
            }

            table {
                font-size: 14px;
            }

            th, td {
                padding: 10px;
            }

            .description-cell {
                max-width: 150px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Tasks</h1>
        <div class="table-container">
            <table>
                <tr>
                    <th>ID</th>
                    <th>Title</th>
                    <th>Description</th>
                    <th>Status</th>
                    <th>Assigned To</th>
                    <th>Created By</th>
                    <th>Timestamp</th>
                    <th>Actions</th>
                </tr>
                {% for task in tasks %}
                <tr>
                    <td>{{ task.id }}</td>
                    <td>{{ task.title }}</td>
                    <td class="description-cell" title="{{ task.description }}">{{ task.description }}</td>
                    <td class="status-cell status-{{ task.status.lower() }}">{{ task.status }}</td>
                    <td>{{ task.assigned_to }}</td>
                    <td>{{ task.created_by }}</td>
                    <td class="timestamp-cell">{{ task.timestamp }}</td>
                    <td>
                        <a href="/tasks/update/{{ task.id }}" class="action-link">Update Status</a>
                    </td>
                </tr>
                {% endfor %}
            </table>
        </div>
        <a href="/dashboard" class="back-link">Back to Dashboard</a>
    </div>

    <script>
        // Add tooltip functionality for truncated descriptions
        document.querySelectorAll('.description-cell').forEach(cell => {
            if (cell.offsetWidth < cell.scrollWidth) {
                cell.style.cursor = 'help';
            }
        });
    </script>
</body>
</html>
