<!DOCTYPE html>
<html>
<head>
    <title>Upload Document</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 500px;
        }

        h1 {
            color: #2c3e50;
            text-align: center;
            margin-bottom: 30px;
            font-size: 2.2em;
            position: relative;
            padding-bottom: 10px;
        }

        h1::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 60px;
            height: 3px;
            background: #3498db;
        }

        form {
            margin-bottom: 25px;
        }

        .file-upload-container {
            margin: 20px 0;
            text-align: center;
        }

        .file-upload-label {
            display: block;
            margin-bottom: 15px;
            color: #34495e;
            font-size: 1.1em;
            font-weight: 500;
        }

        .file-upload-input {
            display: none;
        }

        .file-upload-btn {
            display: inline-block;
            padding: 15px 25px;
            background: #f8f9fa;
            border: 2px dashed #3498db;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            width: 100%;
        }

        .file-upload-btn:hover {
            background: #e8f4fc;
            border-color: #2980b9;
        }

        .file-upload-btn span {
            display: block;
            margin-top: 10px;
            font-size: 0.9em;
            color: #666;
        }

        .submit-btn {
            background: #3498db;
            color: white;
            padding: 12px 25px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            font-size: 1.1em;
            transition: background 0.3s ease;
        }

        .submit-btn:hover {
            background: #2980b9;
        }

        .links-container {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid #eee;
        }

        .link {
            text-decoration: none;
            color: #3498db;
            padding: 10px;
            border-radius: 5px;
            transition: background 0.3s ease;
            text-align: center;
        }

        .link:hover {
            background: #f8f9fa;
            color: #2980b9;
        }

        /* File name display */
        #file-name-display {
            margin-top: 10px;
            font-size: 0.9em;
            color: #666;
            word-break: break-all;
        }

        /* Responsive design */
        @media (max-width: 480px) {
            .container {
                padding: 20px;
            }

            h1 {
                font-size: 1.8em;
            }

            .file-upload-btn {
                padding: 12px 20px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Upload a Document</h1>
        <form action="/upload" method="post" enctype="multipart/form-data">
            <div class="file-upload-container">
                <label class="file-upload-label">Select a file to upload</label>
                <label class="file-upload-btn">
                    <input type="file" name="document" id="document" required class="file-upload-input" onchange="updateFileName(this)">
                    <i>📄 Choose File</i>
                    <span>or drag and drop file here</span>
                </label>
                <div id="file-name-display"></div>
            </div>
            <input type="submit" value="Upload Document" class="submit-btn">
        </form>
        
        <div class="links-container">
            <a href="/documents" class="link">View Uploaded Documents</a>
            <a href="/blockchain" class="link">View Blockchain</a>
        </div>
    </div>

    <script>
        function updateFileName(input) {
            const fileName = input.files[0]?.name;
            document.getElementById('file-name-display').textContent = fileName || '';
        }

        // Drag and drop functionality
        const dropZone = document.querySelector('.file-upload-btn');
        
        ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
            dropZone.addEventListener(eventName, preventDefaults, false);
        });

        function preventDefaults(e) {
            e.preventDefault();
            e.stopPropagation();
        }

        ['dragenter', 'dragover'].forEach(eventName => {
            dropZone.addEventListener(eventName, highlight, false);
        });

        ['dragleave', 'drop'].forEach(eventName => {
            dropZone.addEventListener(eventName, unhighlight, false);
        });

        function highlight(e) {
            dropZone.style.background = '#e8f4fc';
        }

        function unhighlight(e) {
            dropZone.style.background = '#f8f9fa';
        }

        dropZone.addEventListener('drop', handleDrop, false);

        function handleDrop(e) {
            const dt = e.dataTransfer;
            const files = dt.files;
            document.querySelector('.file-upload-input').files = files;
            updateFileName(document.querySelector('.file-upload-input'));
        }
    </script>
</body>
</html>
