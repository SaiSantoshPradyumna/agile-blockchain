<!DOCTYPE html>
<html>
<head>
    <title>Login</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 400px;
        }

        h1 {
            color: #2c3e50;
            text-align: center;
            margin-bottom: 30px;
            font-size: 2.2em;
            position: relative;
            padding-bottom: 10px;
        }

        h1::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 60px;
            height: 3px;
            background: #3498db;
        }

        .alert {
            display: none;  /* Hidden by default */
            background: #fee;
            border-left: 4px solid #f56565;
            padding: 15px;
            margin-bottom: 20px;
            border-radius: 5px;
        }

        .alert.show {
            display: block;
        }

        .alert ul {
            list-style-type: none;
            color: #c53030;
            margin: 0;
            padding: 0;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #2c3e50;
            font-weight: 500;
        }

        input[type="text"],
        input[type="password"] {
            width: 100%;
            padding: 12px;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            font-size: 1em;
            transition: border-color 0.3s ease;
        }

        input[type="text"]:focus,
        input[type="password"]:focus {
            outline: none;
            border-color: #3498db;
        }

        .submit-btn {
            width: 100%;
            padding: 12px;
            background: #3498db;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1.1em;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }

        .submit-btn:hover {
            background: #2980b9;
        }

        .register-link {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #3498db;
            text-decoration: none;
            font-size: 0.9em;
            transition: color 0.3s ease;
        }

        .register-link:hover {
            color: #2980b9;
            text-decoration: underline;
        }

        /* Password visibility toggle */
        .password-container {
            position: relative;
        }

        .password-toggle {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            color: #718096;
        }

        @media (max-width: 480px) {
            .container {
                padding: 20px;
            }

            h1 {
                font-size: 1.8em;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>User Login</h1>
        
        <!-- Store flash messages in a hidden div -->
        <div id="flash-messages" style="display: none;">
            {{ get_flashed_messages()|tojson|safe }}
        </div>

        <!-- Alert container -->
        <div id="alert" class="alert">
            <ul id="alert-messages"></ul>
        </div>

        <form action="/login" method="post">
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" name="username" id="username" required>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <div class="password-container">
                    <input type="password" name="password" id="password" required>
                    <span class="password-toggle" onclick="togglePassword()">👁️</span>
                </div>
            </div>

            <button type="submit" class="submit-btn">Login</button>
        </form>

        <a href="/register" class="register-link">Don't have an account? Register here</a>
    </div>

    <script>
        // Handle flash messages
        document.addEventListener('DOMContentLoaded', function() {
            const flashMessagesDiv = document.getElementById('flash-messages');
            const alertDiv = document.getElementById('alert');
            const alertMessages = document.getElementById('alert-messages');
            
            try {
                const messages = JSON.parse(flashMessagesDiv.textContent);
                if (messages && messages.length > 0) {
                    messages.forEach(message => {
                        const li = document.createElement('li');
                        li.textContent = message;
                        alertMessages.appendChild(li);
                    });
                    alertDiv.classList.add('show');
                }
            } catch (e) {
                console.error('Error parsing flash messages:', e);
            }
        });

        function togglePassword() {
            const passwordInput = document.getElementById('password');
            const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
            passwordInput.setAttribute('type', type);
        }
    </script>
</body>
</html>
